name: Survey crib v4 pre-cut twins

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional prior survey run ID (resume needs separate approval)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

# Exactly one approved dispatch; no automatic retry or continuation.
jobs:
  survey-shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ['1', '2', '3', '4']
    concurrency:
      group: crib-v4-survey-shard-${{ matrix.shard }}
      cancel-in-progress: false
    # setup-python has no 3.14.4 build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Reserve final thirty minutes for checkpoint and upload
        run: echo "V4_STOP_AT=$(( $(date +%s) + 300 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Deliberately frozen experiment runtime, independent of later repo upgrades.
          python-version: '3.14.4'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve matched historical inputs by asset ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs diagnostic
          if ! gh api -H 'Accept: application/octet-stream' repos/markafitzgerald1/simulate-cribbage-games/releases/assets/697897856 > inputs/full.json; then
            gh release download expected-crib-points --repo markafitzgerald1/simulate-cribbage-games --pattern expected_crib_points.json --output inputs/full.json --clobber
          fi
          if ! gh api -H 'Accept: application/octet-stream' repos/markafitzgerald1/simulate-cribbage-games/releases/assets/697897857 > inputs/client.json; then
            gh release download expected-crib-points --repo markafitzgerald1/simulate-cribbage-games --pattern expected_crib_points.client.json --output inputs/client.json --clobber
          fi
          # Every route must match the original full/client/policy hashes before use.
          python -c 'from pathlib import Path; from scripts.run_crib_v4_diagnostic import verified_inputs; verified_inputs(Path("inputs/full.json"), Path("inputs/client.json"))'
      - name: Verify resume run provenance
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" | python -c 'import json, os, sys; from scripts.run_crib_v4_survey import validate_resume_run; validate_resume_run(json.load(sys.stdin), os.environ["GITHUB_REPOSITORY"])'
      - name: Restore compatible per-group checkpoints
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: crib-v4-survey-shard-${{ matrix.shard }}
          path: diagnostic
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Measure the declared survey shard
        id: measurement
        run: |
          exec python -u -m scripts.run_crib_v4_survey \
            --source inputs/full.json --client inputs/client.json \
            --output diagnostic --stop-at "$V4_STOP_AT" --shard "${{ matrix.shard }}"
      - name: Record upload start and local bytes
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
        run: |
          mkdir -p diagnostic
          date -u +'%Y-%m-%dT%H:%M:%SZ' > diagnostic/upload-start.txt
          {
            echo "This attempt measurement step: $MEASUREMENT_OUTCOME. A failed/skipped attempt does not validate restored results."
            du -sb diagnostic
            echo 'Upload duration, transferred bytes and artifact digest: see the upload step log. Incomplete groups remain incomplete; no automatic continuation.'
            if [ -f diagnostic/summary.json ]; then cat diagnostic/summary.json; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve checkpoints and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crib-v4-survey-shard-${{ matrix.shard }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
