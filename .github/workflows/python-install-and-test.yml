name: Python package

on:
  pull_request:
  push:
    branches:
      - main

# The matrices below keep the version literal on purpose. A strategy block is
# evaluated before any checkout and cannot read .python-version, which the
# single-version workflows use instead. The list is also what a second
# supported version would be added to.
jobs:
  legacy-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14.4"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test with unittest and ensure >= 12% coverage
        run: |
          coverage run --data-file=.coverage.legacy
          coverage report --data-file=.coverage.legacy
          coverage report --data-file=.coverage.legacy --fail-under=100 -m --include="scripts/check_legacy_pylint_ratchet.py"
      - name: Upload legacy coverage
        uses: actions/upload-artifact@v7
        with:
          name: artifact-coverage-legacy-${{ matrix.python-version }}
          path: .coverage.legacy
          include-hidden-files: true

  artifact-fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14.4"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test artifact pipeline fast path
        run: |
          coverage run --data-file=.coverage.fast -m unittest discover artifact_pipeline
      - name: Upload fast artifact coverage
        uses: actions/upload-artifact@v7
        with:
          name: artifact-coverage-fast-${{ matrix.python-version }}
          path: .coverage.fast
          include-hidden-files: true

  artifact-slow-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.4"]
        group:
          - hessel-compat
          - zero-weights-coverage
          - support-dynamic-hessel
          - historical-true-nobs
          - historical-flat-nobs

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test exact analytical integration shard
        run: |
          coverage run --data-file=.coverage.slow-${{ matrix.group }} scripts/run_slow_analytical_tests.py ${{ matrix.group }}
      - name: Upload slow artifact coverage
        uses: actions/upload-artifact@v7
        with:
          name: artifact-coverage-slow-${{ matrix.group }}-${{ matrix.python-version }}
          path: .coverage.slow-${{ matrix.group }}
          include-hidden-files: true

  artifact-coverage:
    runs-on: ubuntu-latest
    needs:
      - legacy-tests
      - artifact-fast-tests
      - artifact-slow-tests
    strategy:
      matrix:
        python-version: ["3.14.4"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Download artifact coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: artifact-coverage-*-${{ matrix.python-version }}
          merge-multiple: true
      - name: Check artifact pipeline and legacy ratchet coverage
        run: |
          coverage combine .coverage.fast .coverage.slow-hessel-compat .coverage.slow-zero-weights-coverage .coverage.slow-support-dynamic-hessel .coverage.slow-historical-true-nobs .coverage.slow-historical-flat-nobs .coverage.legacy
          coverage report --fail-under=100 -m --include="artifact_pipeline/*,scripts/check_legacy_pylint_ratchet.py"

  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14.4"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install Node.js dependencies
        run: |
          npm ci --ignore-scripts
      - name: Check for PEP8 style violations in artifact pipeline
        run: |
          flake8 artifact_pipeline
      - name: Check artifact pipeline pylint issues
        run: |
          pylint --persistent=n artifact_pipeline
      - name: Check legacy simulator pylint ratchet
        run: |
          python scripts/check_legacy_pylint_ratchet.py
      - name: Check for type errors
        run: |
          mypy simulate_cribbage_games.py
      - name: Check spelling
        run: |
          npm run spellcheck
      - name: Check for PEP8 style violations
        run: |
          flake8

  frontend-tests-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Java JDK (required by PMD CPD)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install PMD CPD (v6.55.0)
        run: |
          wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip
          unzip -q pmd-bin-6.55.0.zip
          ln -s "$GITHUB_WORKSPACE/pmd-bin-6.55.0/bin/run.sh" "$GITHUB_WORKSPACE/pmd-bin-6.55.0/bin/pmd"
          echo "$GITHUB_WORKSPACE/pmd-bin-6.55.0/bin" >> "$GITHUB_PATH"
      - name: Install Node.js dependencies
        run: |
          npm ci
      - name: Run clean build artifacts
        run: |
          npm run clean
      - name: Run TCM Build
        run: |
          npm run tcm-build
      - name: Run ESLint
        run: |
          npm run eslint
      - name: Run TypeScript compiler build
        run: |
          npm run tsc-build
      - name: Run Jest tests and coverage check
        run: |
          npm run coverage
      - name: Run PMD Copy/Paste Detector
        run: |
          npm run cpd
      - name: Build Webapp with Parcel
        run: |
          npm run build-webapp

      - name: Install Chromium for browser acceptance
        run: npm run e2e:install
      - name: Run play UI browser acceptance
        run: npm run e2e
      - name: Upload browser failure report and trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The Rust CFR input generator (native/cfr). The toolchain is pinned by
  # native/cfr/rust-toolchain.toml, which rustup reads on first use. The
  # gates mirror the Python and TypeScript ones: formatting, lint (clippy's
  # pedantic group, set in Cargo.toml), tests with 100% line coverage, PMD
  # copy/paste detection, and dependency advisories, licenses and sources.
  rust-cfr-inputs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/cfr
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # Pinned so a new tool release cannot turn ci-passed red on its own.
      # Dependabot does not track these; bump them by hand.
      - name: Install cargo-llvm-cov and cargo-deny
        uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-deny@0.20.2
      - name: Set up Java JDK (required by PMD CPD)
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install PMD CPD (v7.24.0, which reads Rust)
        working-directory: ${{ github.workspace }}
        run: |
          wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.24.0/pmd-dist-7.24.0-bin.zip
          unzip -q pmd-dist-7.24.0-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pmd-bin-7.24.0/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --release
      # Coverage counters are shared by every thread, so a parallel solve
      # spends its time contending for them (12 s against 148 s for one
      # test). One rayon thread keeps the run short; the plain test step
      # above and the explicit pools in tests/solve.rs still cover threads.
      - name: Check 100% line coverage
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo llvm-cov --locked --release --fail-under-lines 100 --show-missing-lines
      - name: Run PMD Copy/Paste Detector
        run: pmd cpd --language rust --minimum-tokens 40 --dir src
      - name: Check dependency advisories, licenses and sources
        run: cargo deny --locked check

  # Stable aggregate gate required by branch protection on main (#177).
  # When adding a new job to this workflow, add it to the needs list below;
  # every job in this workflow must gate ci-passed.
  ci-passed:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - legacy-tests
      - artifact-fast-tests
      - artifact-slow-tests
      - artifact-coverage
      - lint-and-typecheck
      - frontend-tests-and-build
      - rust-cfr-inputs
    steps:
      - name: Check required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Evaluating required job results from needs context:"
          echo "$NEEDS_JSON" | jq .

          # Any job whose result is not 'success' (e.g. failure, cancelled, or skipped) fails the aggregate gate.
          non_success=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$non_success" ]; then
            echo "::error::The following required job(s) did not succeed:"
            echo "$non_success"
            exit 1
          fi
          echo "All required jobs succeeded."
