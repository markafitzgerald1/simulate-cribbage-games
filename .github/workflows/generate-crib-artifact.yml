name: Generate Crib V3 Artifact

on:
  # Only for changes that can reach generation or the export step. A
  # documentation-only pull request cannot, and was paying minutes of bounded
  # generation for nothing. Safe because this workflow supplies no required
  # status check -- a path-filtered workflow reports no check at all rather
  # than a skipped one, which would leave a required check pending forever.
  pull_request:
    branches:
      - main
    paths:
      - artifact_pipeline/**
      - simulate_cribbage_games.py
      - requirements.txt
      - .python-version
      - .github/workflows/generate-crib-artifact.yml
  workflow_dispatch:

jobs:
  generate-table:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Version comes from .python-version, the same file pyenv reads locally,
      # so CI and local development cannot drift apart.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Runs Python in unbuffered mode (-u) so progress prints in real-time.
      # Limits max-generations to 1 for PRs; Generation 1 is ~700x slower due to
      # dynamic card combinations evaluation (690 hand score lookups per sample).
      - name: Generate analytical bootstrap table (Fast for PRs)
        if: github.event_name == 'pull_request'
        run: |
          python -u artifact_pipeline/analytical_solver.py --max-iterations=2 --full-hand-policy-max-iterations=1 --output expected_crib_points.analytical.json

      - name: Generate analytical bootstrap table (Production)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -u artifact_pipeline/analytical_solver.py --convergence-threshold=0.001 --output expected_crib_points.analytical.json

      - name: Run fast PR table generation
        if: github.event_name == 'pull_request'
        run: |
          python -u artifact_pipeline/generate_table.py --bootstrap=expected_crib_points.analytical.json --samples=300 --max-generations=1 --output=expected_crib_points.json --no-resume --seed=42 --use-control-variates

      # Bounded because the analytical bootstrap is already converged. A 16k
      # production run completed in 3h32m; 22k samples extrapolates to about
      # 4h50m, leaving roughly 70m below the 6h Actions limit.
      - name: Run production table generation
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -u artifact_pipeline/generate_table.py --bootstrap=expected_crib_points.analytical.json --samples=22000 --convergence-threshold=0.10 --max-generations=2 --fail-on-non-convergence --output=expected_crib_points.json --no-resume --seed=42 --use-control-variates

      # Export for PR and manual generation artifacts. Exact release rollback
      # is handled by activate-crib-v4.yml from the pinned v3 reference.
      - name: Export uncertainty sidecar
        run: |
          before="$(sha256sum expected_crib_points.client.json | cut -d' ' -f1)"
          python -u -m artifact_pipeline.export_uncertainty \
            --table crib \
            --full expected_crib_points.json \
            --means expected_crib_points.client.json \
            --output expected_crib_points.uncertainty.json
          after="$(sha256sum expected_crib_points.client.json | cut -d' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "Client means bytes changed during export: $before -> $after" >&2
            exit 1
          fi
          python -c 'import json, sys; count = json.load(open("expected_crib_points.uncertainty.json"))["record_groups"]["totals"]["record_count"]; print(f"Exported {count} measured records"); sys.exit(0 if count else "Sidecar carries no measured records")'

      - name: Upload analytical bootstrap artifact
        uses: actions/upload-artifact@v7
        with:
          name: expected-crib-points-analytical
          path: expected_crib_points.analytical.json

      - name: Upload table artifact
        uses: actions/upload-artifact@v7
        with:
          name: expected-crib-points
          path: expected_crib_points.json

      # Lean table consumed directly by the web client (cribbage-trainer).
      - name: Upload client table artifact
        uses: actions/upload-artifact@v7
        with:
          name: expected-crib-points-client
          path: expected_crib_points.client.json

      - name: Upload uncertainty sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: expected-crib-points-uncertainty
          path: expected_crib_points.uncertainty.json
