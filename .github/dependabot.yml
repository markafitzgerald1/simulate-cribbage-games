version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Maintain dependencies for pip (requirements.in / requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-dependencies:
        patterns:
          - "*"
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Maintain dependencies for npm (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Bounded to the current release (not >=10) so the ignore ages out and
      # prompts a periodic compatibility re-check. Blocked by the latest
      # eslint-plugin-react peer range (^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9.7).
      - dependency-name: "eslint"
        versions: [">=10.0.0 <=10.11.0"]
      # Bounded to the current release (not >=18) so the ignore ages out and
      # prompts a periodic compatibility re-check. Retiring the frontend to
      # cribbage-trainer (#103, #129).
      - dependency-name: "react"
        versions: [">=18.0.0 <=19.3.0"]
      - dependency-name: "react-dom"
        versions: [">=18.0.0 <=19.3.0"]
      - dependency-name: "@types/react"
        versions: [">=18.0.0 <=19.3.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=18.0.0 <=19.3.0"]
      # Bounded to the current release (not >=6.1) so the ignore ages out and
      # prompts a periodic compatibility re-check. Blocked by
      # @typescript-eslint/eslint-plugin peer range (<6.1.0).
      - dependency-name: "typescript"
        versions: [">=6.1.0 <=7.0.2"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
